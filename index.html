
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#059669">

    <title>Rovixa Pos</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

         <div class="banner">
        <img
            src="logo/rovixa-banner.png"
            alt="Rovixa POS Banner"
        >
    </div>

        <div class="logo">
            <img
                src="logo/rovixa-icon.png"
                alt="Rovixa Logo"
            >
        </div>

        <h1>Rovixa Pos</h1>

        <p class="description">
            Sistem kasir dan manajemen toko dalam satu platform.
            Pilih aplikasi yang ingin Anda buka.
        </p>

        <section class="apps" aria-label="Aplikasi Treehouse POS">

            <a
                class="app"
                data-app-link
                href="./KasirPenjualan/"
            >
                <span class="app-icon" aria-hidden="true">▣</span>

                <span class="app-content">
                    <h2>Penjualan</h2>
                    <p>Transaksi kasir dan pembayaran.</p>
                </span>
            </a>

            <a
                class="app"
                data-app-link
                href="./KasirPembelian/"
            >
                <span class="app-icon" aria-hidden="true">▤</span>

                <span class="app-content">
                    <h2>Pembelian</h2>
                    <p>Pencatatan pembelian dan pemasok.</p>
                </span>
            </a>

            <a
                class="app"
                data-app-link
                href="./Management/"
            >
                <span class="app-icon" aria-hidden="true">⚙</span>

                <span class="app-content">
                    <h2>Management</h2>
                    <p>Pengelolaan data dan operasional toko.</p>
                </span>
            </a>

        </section>

        <p
            id="client-status"
            class="status"
            role="status"
            aria-live="polite"
        ></p>

        <a class="installation" href="./instalasi/">
            Instalasi Toko Baru
        </a>

        <footer>
            Rovixa-net &copy; 2026
        </footer>

    </main>

    <script src="app.js"></script>

</body>
</html>
